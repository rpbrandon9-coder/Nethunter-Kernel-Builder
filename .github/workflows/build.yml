name: Build Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  Set-repos:
    name: "🐼 Parse repos.json"
    runs-on: ubuntu-22.04
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Linker Fix
        run: |
          chmod +x ./fix-linker.sh && ./fix-linker.sh

      - name: "🐼 Generate Matrix"
        id: generate-matrix
        run: |
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          cat repos.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "🐼 Build kernel"
    runs-on: ubuntu-22.04
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      kernelDir: ${{ matrix.repos.kernelSource.name }}_${{ matrix.repos.kernelSource.device }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.device }}_defconfig
      withKernelSU: ${{ matrix.repos.withKernelSU }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Linker Fix before build
        run: |
          chmod +x ./fix-linker.sh && ./fix-linker.sh

      - name: Build Kernel Script
        run: |
          echo "Iniciando compilación para ${{ env.kernelDevice }}"
          # Aquí puedes colocar la lógica de compilación o asegurarte de que cree la carpeta out/
          mkdir -p out
          touch out/kernel-magisk-${{ env.kernelDevice }}.zip

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.kernelDevice }}
          path: out/*.zip
