name: Build Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  Set-repos:
    name: "🐼 Parse repos.json"
    runs-on: ubuntu-22.04
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Linker Fix
        run: |
          chmod +x ./fix-linker.sh && ./fix-linker.sh

      - name: "🐼 Generate Matrix"
        id: generate-matrix
        run: |
          echo "repos<<EOF" >> $GITHUB_OUTPUT
          cat repos.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  Build-Kernel:
    name: "🐼 Build kernel"
    runs-on: ubuntu-22.04
    needs:
      - Set-repos
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}
    env:
      kernelDir: ${{ matrix.repos.kernelSource.name }}_${{ matrix.repos.kernelSource.device }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.device }}_defconfig
      withKernelSU: ${{ matrix.repos.withKernelSU }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Linker Fix before build
        run: |
          chmod +x ./fix-linker.sh && ./fix-linker.sh

      - name: Setup Compilation Environment
        run: |
          sudo apt-get update && sudo apt-get install -y bc bison build-essential git flex libelf-dev libssl-dev zlib1g-dev

      - name: Clone Kernel Source and Toolchain
        run: |
          git clone --depth=1 ${{ env.kernelRepo }} -b ${{ env.kernelBranch }} kernel_source
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

      - name: Patch -no-pie flag for modern ld
        run: |
          cd kernel_source
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-no-pie/--no-pie/g' {} +

      - name: Build Kernel
        run: |
          cd kernel_source
          export PATH="$(pwd)/../toolchain/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Generar configuración
          make O=out ${{ env.DEFCONFIG_NAME }}
          
          # Compilar
          make -j$(nproc) O=out CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone https://github.com/kernel-makers/AnyKernel3 -b master anykernel
          cp kernel_source/out/arch/arm64/boot/Image.gz-dtb anykernel/
          cd anykernel
          zip -r9 ../kernel-${{ env.kernelDevice }}.zip *

      - name: Upload Real Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ env.kernelDevice }}-real
          path: kernel-*.zip
