name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      kernelRepo: https://github.com/MiCode/Xiaomi_Kernel_OpenSource
      kernelBranch: topaz-t-oss
      kernelDevice: tapas
      DEFCONFIG_NAME: tapas_defconfig

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Compilation Environment
      run: |
        sudo apt-get update && sudo apt-get install -y bc bison build-essential git flex libelf-dev libsl-dev zlib1g-dev

    - name: Clone Kernel Source and Toolchain
      run: |
        git clone --depth=1 ${{ env.kernelRepo }} -b ${{ env.kernelBranch }} kernel_source
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain

    - name: Remove unsupported no-pie flags from Makefiles
      run: |
        cd kernel_source
        find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-no-pie//g' {} +
        find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/--no-pie//g' {} +

    - name: Build Kernel
      run: |
        cd kernel_source
        export PATH="$(pwd)/../toolchain/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        make O=out ${{ env.DEFCONFIG_NAME }}
        make -j$(nproc) O=out CC=clang AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

    - name: Package Kernel (AnyKernel3)
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 -b master anykernel
        cp kernel_source/out/arch/arm64/boot/Image.gz-dtb anykernel/
        cd anykernel
        zip -r9 ../kernel-${{ env.kernelDevice }}.zip *

    - name: Upload Real Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernel-${{ env.kernelDevice }}-real
        path: kernel-${{ env.kernelDevice }}.zip
